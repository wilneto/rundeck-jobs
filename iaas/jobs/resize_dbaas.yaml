- id: mgc-recize-disck-dbaas
  name: "MGC - DBaaS Disk Resize (+%)"
  description: |-
    Resize de disco (volume.size) em instâncias DBaaS na Magalu Cloud (MGC).

    Comportamento:
    - Sempre executa o resize (sem dry-run)
    - Usa --no-confirm por padrão
    - Exibe resumo apenas do que foi efetivamente alterado

    Requisitos:
    - mgc CLI no PATH
    - jq instalado
  loglevel: INFO
  executionEnabled: true
  nodeFilterEditable: false
  defaultTab: nodes

  options:
    - name: API_KEY
      label: "MGC API Key"
      description: "API Key para autenticação no MGC (obrigatório)."
      required: true
      secure: true
      valueExposed: true

    - name: REGION
      label: "Região"
      description: "Região do serviço DBaaS"
      required: true
      value: "br-se1"
      values:
        - "br-se1"
        - "br-ne1"
        - "br-mgl1"

    - name: INSTANCE_ID
      label: "Instance ID (opcional)"
      description: "Se informado, aplica apenas nessa instância (UUID)."
      required: false

    - name: INSTANCE_NAME
      label: "Instance Name (opcional)"
      description: "Se informado, aplica apenas na instância com esse nome (match exato)."
      required: false

    - name: PERCENT
      label: "Percentual de aumento"
      description: "Percentual a adicionar ao volume atual (ex: 50 = +50%)."
      required: true
      value: "50"

  sequence:
    strategy: node-first
    keepgoing: false
    commands:
      - script: |-
          #!/usr/bin/env bash
          set -euo pipefail

          API_KEY="${RD_OPTION_API_KEY}"
          REGION="${RD_OPTION_REGION:-br-se1}"
          FILTER_ID="${RD_OPTION_INSTANCE_ID:-}"
          FILTER_NAME="${RD_OPTION_INSTANCE_NAME:-}"
          PERCENT="${RD_OPTION_PERCENT:-50}"

          MIN_SIZE=10
          MAX_SIZE=50000

          die() { echo "ERROR: $*" >&2; exit 1; }
          log() { echo "[$(date +'%F %T')] $*"; }

          ceil_div() {
            echo $(( ($1 + $2 - 1) / $2 ))
          }

          calc_new_size() {
            local old="$1"
            local pct="$2"
            local new
            new="$(ceil_div $((old * (100 + pct))) 100)"
            (( new <= old )) && new=$((old + 1))
            (( new < MIN_SIZE )) && new="$MIN_SIZE"
            (( new > MAX_SIZE )) && new="$MAX_SIZE"
            echo "$new"
          }

          mgc_cmd() {
            mgc --region "$REGION" --api-key "$API_KEY" "$@"
          }

          log "Região=$REGION | Percentual=+$PERCENT% | no-confirm=ON"

          raw_json="$(mgc_cmd dbaas instances list --raw --output json)"
          instances="$(echo "$raw_json" | jq '.results')"

          [[ "$(echo "$instances" | jq 'length')" -gt 0 ]] || die "Nenhuma instância encontrada"

          declare -a SUMMARY=()
          applied=0
          failed=0

          echo "$instances" | jq -c '.[]' | while read -r inst; do
            id="$(echo "$inst" | jq -r '.id')"
            name="$(echo "$inst" | jq -r '.name')"
            old="$(echo "$inst" | jq -r '.volume.size')"
            new="$(calc_new_size "$old" "$PERCENT")"

            if (( new == old )); then
              log "Ignorado $name ($id): tamanho inalterado ($old GiB)"
              continue
            fi

            log "Resize $name ($id): ${old}GiB → ${new}GiB"

            if mgc_cmd dbaas instances resize \
              --instance-id "$id" \
              --volume.size "$new" \
              --no-confirm; then
              SUMMARY+=("$name | $id | $old → $new | OK")
              ((applied++))
            else
              SUMMARY+=("$name | $id | $old → $new | FAIL")
              ((failed++))
            fi
          done

          echo
          echo "==================== RESUMO FINAL ===================="
          echo "name | id | old → new | status"
          printf '%s\n' "${SUMMARY[@]}"
          echo "------------------------------------------------------"
          echo "applied=$applied failed=$failed"
          echo "======================================================"