- id: dbaas_resize_auto_discovery
  defaultTab: output
  description: "Auto discovery de DBaaS (API + métricas) com alerta no GChat e resize automático opcional."
  executionEnabled: true
  loglevel: INFO
  name: "MGC - DBaaS AutoDiscovery + GChat + AutoResize"
  nodeFilterEditable: false
  scheduleEnabled: false

  options:
    # =======================
    # Credenciais MGC
    # =======================
    - name: API_KEY
      label: MGC API Key
      description: "API Key do tenant (secure)."
      required: true
      secure: true
      valueExposed: true

    - name: TENANT_ID
      label: Tenant ID
      description: "UUID do tenant."
      required: true

    # =======================
    # Parâmetros gerais
    # =======================
    - name: REGION
      label: Região
      description: "Ex: br-se1 (se vazio, auto-detect)."
      required: false
      value: ""

    - name: MOUNTPOINT
      label: Mountpoint preferido
      description: "Se vazio ou '/', auto-detect usa disco de dados."
      required: false
      value: "/"

    - name: TIMEOUT
      label: Timeout curl (s)
      required: false
      value: "4"

    - name: OUTPUT_DIR
      label: Diretório de saída
      required: false
      value: "/var/log/rundeck"

    - name: SHOW_SAMPLE
      label: Debug (0/1)
      required: false
      value: "0"

    # =======================
    # Política
    # =======================
    - name: THRESHOLD_WARN
      label: Threshold WARN (%)
      required: false
      value: "80"

    - name: THRESHOLD_CRIT
      label: Threshold CRIT (%)
      required: false
      value: "90"

    - name: PCT_INCREASE_WARN
      label: Resize WARN (%)
      required: false
      value: "30"

    - name: PCT_INCREASE_CRIT
      label: Resize CRIT (%)
      required: false
      value: "50"

    - name: AUTO_APPLY
      label: Auto aplicar resize (0/1)
      required: false
      value: "0"

    - name: COOLDOWN_MINUTES
      label: Cooldown (min)
      required: false
      value: "360"

    # =======================
    # Integração Rundeck
    # =======================
    - name: RESIZE_JOB_UUID
      label: UUID do job de resize
      required: true
      value: "294c9634-71d1-404f-9658-6d742c70f27d"

    - name: RD_URL
      label: URL do Rundeck
      required: false
      value: "http://localhost:4440"

    - name: RD_API_VERSION
      label: Versão API Rundeck
      required: false
      value: "52"

  sequence:
    keepgoing: false
    strategy: node-first
    commands:
      - description: "Auto discovery + alerta + resize opcional"
        script: |
          #!/usr/bin/env bash
          set -euo pipefail

          # ============================================================
          # SEGREDOS (Key Storage)
          #
          # GChat webhook:
          #   keys/project/iaas/gchat/webhook_url
          #
          # Token da API do Rundeck:
          #   keys/project/iaas/rundeck/api_token
          # ============================================================
          #GCHAT_WEBHOOK_URL="${key:keys/project/iaas/gchat/webhook_url}"
          GCHAT_WEBHOOK_URL="https://chat.googleapis.com/v1/spaces/AAQAZtSBxyQ/messages?key=AIzaSyDdI0hCZtE6vySjMm-WEfRq3CPzqKqqsHI&token=bkWgUVT9LmVIV93vxaw3koLvfOi0UeCoxoyT4eH_B2s"
          RD_TOKEN="${key:keys/project/iaas/rundeck/api_token}"

          API_KEY="${RD_OPTION_API_KEY}"
          TENANT_ID="${RD_OPTION_TENANT_ID}"
          REGION="${RD_OPTION_REGION:-}"
          MOUNTPOINT="${RD_OPTION_MOUNTPOINT:-/}"
          TIMEOUT="${RD_OPTION_TIMEOUT:-4}"
          OUTPUT_DIR="${RD_OPTION_OUTPUT_DIR:-/var/log/rundeck}"
          SHOW_SAMPLE="${RD_OPTION_SHOW_SAMPLE:-0}"

          THRESHOLD_WARN="${RD_OPTION_THRESHOLD_WARN:-80}"
          THRESHOLD_CRIT="${RD_OPTION_THRESHOLD_CRIT:-90}"
          PCT_INCREASE_WARN="${RD_OPTION_PCT_INCREASE_WARN:-30}"
          PCT_INCREASE_CRIT="${RD_OPTION_PCT_INCREASE_CRIT:-50}"
          AUTO_APPLY="${RD_OPTION_AUTO_APPLY:-0}"
          COOLDOWN_MINUTES="${RD_OPTION_COOLDOWN_MINUTES:-360}"

          RESIZE_JOB_UUID="${RD_OPTION_RESIZE_JOB_UUID}"
          RD_URL="${RD_OPTION_RD_URL:-http://localhost:4440}"
          RD_API_VERSION="${RD_OPTION_RD_API_VERSION:-52}"

          CHECK_TS_ISO="$(date -Iseconds)"
          CHECK_TS_HUMAN="$(date '+%Y-%m-%d %H:%M:%S %Z')"

          echo "OK: TENANT_ID=${TENANT_ID}"
          echo "OK: API_KEY recebida (tamanho=${#API_KEY})"

          command -v mgc >/dev/null
          command -v jq >/dev/null
          command -v curl >/dev/null
          command -v awk >/dev/null

          api_get() {
            curl -sS \
              -H "x-api-key: ${API_KEY}" \
              -H "x-tenant-id: ${TENANT_ID}" \
              "$1"
          }

          gchat_send() {
            [[ -n "${GCHAT_WEBHOOK_URL}" ]] || return 0
            curl -sS -X POST \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg text "$1" '{text:$text}')" \
              "${GCHAT_WEBHOOK_URL}" >/dev/null || true
          }

          rundeck_run_resize() {
            curl -sS \
              -H "X-Rundeck-Auth-Token: ${RD_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$(jq -n \
                --arg API_KEY "${API_KEY}" \
                --arg REGION "${REGION}" \
                --arg INSTANCE_ID "$1" \
                --arg INSTANCE_NAME "$2" \
                --arg PERCENTUAL "$3" \
                '{options:{
                  API_KEY:$API_KEY,
                  REGION:$REGION,
                  INSTANCE_ID:$INSTANCE_ID,
                  INSTANCE_NAME:$INSTANCE_NAME,
                  PERCENTUAL:$PERCENTUAL
                }}')" \
              "${RD_URL}/api/${RD_API_VERSION}/job/${RESIZE_JOB_UUID}/run"
          }

          if [[ -z "${REGION}" ]]; then
            for r in br-se1 br-ne1; do
              if api_get "https://api.magalu.cloud/${r}/database/v2/instances" | jq -e . >/dev/null; then
                REGION="$r"; break
              fi
            done
          fi

          echo "OK: REGION=${REGION}"
          echo "OK: MOUNTPOINT(preferido)=${MOUNTPOINT}"
          echo "OK: TIMEOUT=${TIMEOUT}s"

          LIST_JSON="$(api_get "https://api.magalu.cloud/${REGION}/database/v2/instances")"

          echo "DBaaS:"
          jq -r '.results[] | " - \(.name)\t\(.id)\t\(.volume.size)GiB\t\(.status)"' <<< "$LIST_JSON"

          TS="$(date +%Y%m%d-%H%M%S)"
          mkdir -p "${OUTPUT_DIR}"
          OUT="${OUTPUT_DIR}/dbaas-metrics-${TS}.json"
          TMP="${OUT}.ndjson"
          : > "$TMP"

          COOLDOWN_DIR="/var/lib/rundeck/var/dbaas-resize-cooldown"
          mkdir -p "$COOLDOWN_DIR"
          now="$(date +%s)"

          jq -c '.results[]' <<< "$LIST_JSON" | while read -r inst; do
            ID="$(jq -r '.id' <<< "$inst")"
            NAME="$(jq -r '.name' <<< "$inst")"
            D="$(api_get "https://api.magalu.cloud/${REGION}/database/v2/instances/${ID}")"
            IP="$(jq -r '.addresses[]?|select(.access=="PRIVATE")|.address' <<< "$D" | head -n1)"

            METRICS="$(curl -s --max-time "$TIMEOUT" "http://${IP}:8080/node/metrics" || true)"

            MP="$(awk '
              /node_filesystem_size_bytes/ && !/tmpfs/ {
                if (match($0,/mountpoint="[^"]+"/)) {
                  mp=substr($0,RSTART+12,RLENGTH-13)
                  if (mp=="/mnt/database-data") {print mp; exit}
                  size=$NF+0
                  if (size>best) {best=size; bestmp=mp}
                }
              }
              END{print bestmp}
            ' <<< "$METRICS")"

            SIZE="$(awk -v mp="$MP" '/size_bytes/ && $0~mp {print $NF}' <<< "$METRICS")"
            AVAIL="$(awk -v mp="$MP" '/avail_bytes/ && $0~mp {print $NF}' <<< "$METRICS")"

            read USED FREE TOTAL PCT < <(
              awk -v s="$SIZE" -v a="$AVAIL" '
                BEGIN{
                  u=s-a; g=1024*1024*1024
                  printf "%.2f %.2f %.2f %.2f",u/g,a/g,s/g,(u/s)*100
                }'
            )

            LEVEL="OK"
            INC=""
            if awk "BEGIN{exit !($PCT>=$THRESHOLD_CRIT)}"; then
              LEVEL="CRIT"; INC="$PCT_INCREASE_CRIT"
            elif awk "BEGIN{exit !($PCT>=$THRESHOLD_WARN)}"; then
              LEVEL="WARN"; INC="$PCT_INCREASE_WARN"
            fi

            if [[ "$LEVEL" == "OK" ]]; then
              gchat_send "✅ DBaaS ${NAME} (${ID}) uso ${PCT}% — última checagem ${CHECK_TS_HUMAN}. Nenhuma ação necessária."
            else
              gchat_send "🚨 ${LEVEL} DBaaS ${NAME} (${ID}) uso ${PCT}% — sugestão resize +${INC}%."

              if [[ "$AUTO_APPLY" == "1" ]]; then
                stamp="${COOLDOWN_DIR}/${ID}"
                last="$(cat "$stamp" 2>/dev/null || echo 0)"
                if (( now-last > COOLDOWN_MINUTES*60 )); then
                  rundeck_run_resize "$ID" "$NAME" "$INC" >/dev/null
                  echo "$now" > "$stamp"
                  gchat_send "▶️ Resize disparado para ${NAME} (+${INC}%)."
                fi
              fi
            fi

            jq -n \
              --arg name "$NAME" \
              --arg id "$ID" \
              --arg pct "$PCT" \
              --arg level "$LEVEL" \
              --arg checked "$CHECK_TS_ISO" \
              '{name:$name,id:$id,used_pct:($pct|tonumber),level:$level,checked_at:$checked}' >> "$TMP"
          done

          jq -s '.' "$TMP" > "$OUT"
          rm -f "$TMP"
          echo "Relatório salvo em: $OUT"