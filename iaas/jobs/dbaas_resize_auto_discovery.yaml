- id: dbaas_resize_auto_discovery
  defaultTab: output
  description: "Auto discovery de DBaaS (API + métricas) + alerta no GChat + opcionalmente dispara job de resize via API do Rundeck."
  executionEnabled: true
  loglevel: INFO
  name: "MGC - DBaaS AutoDiscovery + Alert (GChat) + AutoResize (optional)"
  nodeFilterEditable: false
  scheduleEnabled: false

  options:
    # ============================================================
    # 1) Credenciais MGC
    # ============================================================
    - name: API_KEY
      label: MGC API Key
      description: "API Key do tenant (secure)."
      required: true
      secure: true
      valueExposed: true

    - name: TENANT_ID
      label: Tenant ID
      description: "UUID do tenant para chamadas API (x-tenant-id)."
      required: true
      value: ""

    # ============================================================
    # 2) Parâmetros gerais
    # ============================================================
    - name: REGION
      label: Região (opcional)
      description: "Ex: br-se1. Se vazio, o script tenta detectar automaticamente."
      required: false
      value: ""

    - name: MOUNTPOINT
      label: Mountpoint
      description: "Mountpoint preferido. Se vazio ou '/', auto-detect escolhe o disco de dados (prioriza /mnt/database-data)."
      required: false
      value: "/"

    - name: TIMEOUT
      label: Timeout curl (segundos)
      description: "Timeout para chamadas HTTP de métricas."
      required: false
      value: "4"

    - name: OUTPUT_DIR
      label: Diretório de saída
      description: "Onde salvar relatório JSON (padrão /var/log/rundeck)."
      required: false
      value: "/var/log/rundeck"

    - name: SHOW_SAMPLE
      label: Debug (0/1)
      description: "1 mostra logs extras (ajuda troubleshooting)."
      required: false
      value: "0"

    # ============================================================
    # 3) Política de alerta e resize
    # ============================================================
    - name: THRESHOLD_WARN
      label: Threshold WARN (%)
      description: "A partir deste %, envia alerta e (se AUTO_APPLY=1) pode disparar resize."
      required: false
      value: "80"

    - name: THRESHOLD_CRIT
      label: Threshold CRIT (%)
      description: "A partir deste %, usa percentual CRIT e marca alerta como crítico."
      required: false
      value: "90"

    - name: PCT_INCREASE_WARN
      label: Aumento WARN (%)
      description: "Percentual para resize em WARN (ex: 30 = +30%)."
      required: false
      value: "30"

    - name: PCT_INCREASE_CRIT
      label: Aumento CRIT (%)
      description: "Percentual para resize em CRIT (ex: 50 = +50%)."
      required: false
      value: "50"

    - name: AUTO_APPLY
      label: Auto aplicar resize (0/1)
      description: "0 = só alerta no GChat. 1 = alerta + dispara job de resize via API do Rundeck."
      required: false
      value: "0"

    - name: COOLDOWN_MINUTES
      label: Cooldown (min)
      description: "Evita disparar resize repetido na mesma instância dentro dessa janela."
      required: false
      value: "360"

    # ============================================================
    # 4) Google Chat (Webhook)
    # ============================================================
    - name: GCHAT_WEBHOOK_URL
      label: GChat Webhook URL
      description: "Incoming webhook do Google Chat (secure). Se vazio, não envia."
      required: false
      secure: true
      valueExposed: true
      value: ""

    # ============================================================
    # 5) Disparo do job de resize via Rundeck API
    # ============================================================
    - name: RESIZE_JOB_UUID
      label: Resize Job UUID
      description: "UUID do job que faz o resize."
      required: true
      value: "294c9634-71d1-404f-9658-6d742c70f27d"

    - name: RD_URL
      label: Rundeck URL
      description: "URL base do Rundeck (ex: http://localhost:4440)."
      required: false
      value: "http://localhost:4440"

    - name: RD_API_VERSION
      label: Rundeck API Version
      description: "Versão da API do Rundeck."
      required: false
      value: "52"

    - name: RD_TOKEN
      label: Rundeck API Token
      description: "Token de API do Rundeck (secure). Obrigatório se AUTO_APPLY=1."
      required: false
      secure: true
      valueExposed: true
      value: ""

  sequence:
    keepgoing: false
    strategy: node-first
    commands:
      - description: "Executa discovery, alerta GChat e (opcional) dispara resize"
        script: |
          #!/usr/bin/env bash
          set -euo pipefail

          # ============================================================
          # 0) Inputs via RD_OPTION_*
          # ============================================================
          API_KEY="${RD_OPTION_API_KEY:-}"
          TENANT_ID="${RD_OPTION_TENANT_ID:-}"
          REGION="${RD_OPTION_REGION:-}"
          MOUNTPOINT="${RD_OPTION_MOUNTPOINT:-/}"
          TIMEOUT="${RD_OPTION_TIMEOUT:-4}"
          OUTPUT_DIR="${RD_OPTION_OUTPUT_DIR:-/var/log/rundeck}"
          SHOW_SAMPLE="${RD_OPTION_SHOW_SAMPLE:-0}"

          THRESHOLD_WARN="${RD_OPTION_THRESHOLD_WARN:-80}"
          THRESHOLD_CRIT="${RD_OPTION_THRESHOLD_CRIT:-90}"
          PCT_INCREASE_WARN="${RD_OPTION_PCT_INCREASE_WARN:-30}"
          PCT_INCREASE_CRIT="${RD_OPTION_PCT_INCREASE_CRIT:-50}"
          AUTO_APPLY="${RD_OPTION_AUTO_APPLY:-0}"
          COOLDOWN_MINUTES="${RD_OPTION_COOLDOWN_MINUTES:-360}"

          GCHAT_WEBHOOK_URL="${RD_OPTION_GCHAT_WEBHOOK_URL:-}"

          RESIZE_JOB_UUID="${RD_OPTION_RESIZE_JOB_UUID:-}"
          RD_URL="${RD_OPTION_RD_URL:-http://localhost:4440}"
          RD_API_VERSION="${RD_OPTION_RD_API_VERSION:-52}"
          RD_TOKEN="${RD_OPTION_RD_TOKEN:-}"

          # ============================================================
          # 1) Validações (não vazar secrets)
          # ============================================================
          [[ -n "${TENANT_ID}" ]] || { echo "ERRO: TENANT_ID não informado."; exit 1; }
          [[ -n "${API_KEY}" ]]   || { echo "ERRO: API_KEY não informada."; exit 1; }
          [[ -n "${RESIZE_JOB_UUID}" ]] || { echo "ERRO: RESIZE_JOB_UUID não informado."; exit 1; }

          if [[ "${AUTO_APPLY}" == "1" && -z "${RD_TOKEN}" ]]; then
            echo "ERRO: AUTO_APPLY=1 exige RD_TOKEN (token de API do Rundeck)."
            exit 1
          fi

          echo "OK: TENANT_ID=${TENANT_ID}"
          echo "OK: API_KEY recebida (tamanho=${#API_KEY})"

          # ============================================================
          # 2) Dependências
          # ============================================================
          command -v mgc  >/dev/null 2>&1 || { echo "ERRO: mgc não encontrado"; exit 1; }
          command -v jq   >/dev/null 2>&1 || { echo "ERRO: jq não encontrado"; exit 1; }
          command -v curl >/dev/null 2>&1 || { echo "ERRO: curl não encontrado"; exit 1; }
          command -v awk  >/dev/null 2>&1 || { echo "ERRO: awk não encontrado"; exit 1; }

          strip_ansi() { sed -r 's/\x1B\[[0-9;]*[mK]//g'; }

          if [[ "${SHOW_SAMPLE}" == "1" ]]; then
            echo "DEBUG: mgc version: $(mgc --version 2>/dev/null || true)"
          fi

          # ============================================================
          # 3) Helpers: MGC API / GChat / Rundeck Run Job
          # ============================================================
          api_get() {
            local url="$1"
            curl -sS \
              -H "x-api-key: ${API_KEY}" \
              -H "x-tenant-id: ${TENANT_ID}" \
              "$url"
          }

          gchat_send() {
            local msg="$1"
            [[ -n "${GCHAT_WEBHOOK_URL}" ]] || return 0
            curl -sS -X POST \
              -H "Content-Type: application/json; charset=UTF-8" \
              -d "$(jq -n --arg text "$msg" '{text:$text}')" \
              "${GCHAT_WEBHOOK_URL}" >/dev/null || true
          }

          rundeck_run_resize_job() {
            # Dispara o job de resize via API do Rundeck
            # Ajuste os nomes das options aqui se seu job usa nomes diferentes.
            local instance_id="$1"
            local instance_name="$2"
            local percent="$3"

            local url="${RD_URL}/api/${RD_API_VERSION}/job/${RESIZE_JOB_UUID}/run"

            local payload
            payload="$(jq -n \
              --arg api_key "${API_KEY}" \
              --arg region "${REGION}" \
              --arg instance_id "${instance_id}" \
              --arg instance_name "${instance_name}" \
              --arg pct "${percent}" \
              '{
                options: {
                  API_KEY: $api_key,
                  REGION: $region,
                  INSTANCE_ID: $instance_id,
                  INSTANCE_NAME: $instance_name,
                  PERCENTUAL: $pct
                }
              }'
            )"

            curl -sS \
              -H "X-Rundeck-Auth-Token: ${RD_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "${payload}" \
              "${url}"
          }

          # ============================================================
          # 4) Detectar região (se vazio)
          # ============================================================
          detect_region() {
            local regions=(br-se1 br-ne1 br-ne-1)
            local r url code
            for r in "${regions[@]}"; do
              url="https://api.magalu.cloud/${r}/database/v2/instances"
              code="$(curl -sS -o /dev/null -w "%{http_code}" \
                -H "x-api-key: ${API_KEY}" \
                -H "x-tenant-id: ${TENANT_ID}" \
                "$url" || true)"
              [[ "$code" == "200" ]] && { echo "$r"; return 0; }
            done
            return 1
          }

          if [[ -z "${REGION}" ]]; then
            REGION="$(detect_region || true)"
            [[ -n "${REGION}" ]] || { echo "ERRO: não consegui detectar REGION automaticamente."; exit 1; }
          fi

          echo "OK: REGION=${REGION}"
          echo "OK: MOUNTPOINT(preferido)=${MOUNTPOINT}"
          echo "OK: TIMEOUT=${TIMEOUT}s"
          echo

          # ============================================================
          # 5) Mapear engine_id -> tipo (mysql|postgres)
          # ============================================================
          ENGINES_JSON="$(
            mgc dbaas engines list --status=ACTIVE --api-key "${API_KEY}" -o json --raw 2>/dev/null \
            | strip_ansi
          )"

          declare -A ENGINE_KIND ENGINE_NAME
          while IFS=$'\t' read -r id name; do
            lname="$(echo "$name" | tr '[:upper:]' '[:lower:]')"
            ENGINE_NAME["$id"]="$name"
            if [[ "$lname" == *mysql* ]]; then
              ENGINE_KIND["$id"]="mysql"
            elif [[ "$lname" == *postgres* ]]; then
              ENGINE_KIND["$id"]="postgres"
            else
              ENGINE_KIND["$id"]="unknown"
            fi
          done < <(jq -r '.results[] | "\(.id)\t\(.name)"' <<< "$ENGINES_JSON")

          # ============================================================
          # 6) Listar instâncias DBaaS via API
          # ============================================================
          LIST_URL="https://api.magalu.cloud/${REGION}/database/v2/instances"
          LIST_JSON="$(api_get "${LIST_URL}")"

          echo "DBaaS:"
          jq -r '.results[] | " - \(.name)\t\(.id)\t\(.volume.size)GiB\t\(.status)"' <<< "$LIST_JSON"
          echo

          # ============================================================
          # 7) Preparar relatório + cooldown state
          # ============================================================
          TS="$(date +%Y%m%d-%H%M%S)"
          mkdir -p "${OUTPUT_DIR}"
          OUT_JSON="${OUTPUT_DIR}/dbaas-metrics-${TS}.json"
          OUT_NDJSON="${OUT_JSON}.ndjson"
          : > "${OUT_NDJSON}"

          COOLDOWN_DIR="/var/lib/rundeck/var/dbaas-resize-cooldown"
          mkdir -p "${COOLDOWN_DIR}"

          now_epoch="$(date +%s)"
          cooldown_sec=$(( COOLDOWN_MINUTES * 60 ))

          # ============================================================
          # 8) Loop por instância
          # ============================================================
          while IFS= read -r inst; do
            INSTANCE_ID="$(jq -r '.id' <<< "$inst")"
            D="$(api_get "https://api.magalu.cloud/${REGION}/database/v2/instances/${INSTANCE_ID}")"

            NAME="$(jq -r '.name' <<< "$D")"
            STATUS="$(jq -r '.status' <<< "$D")"
            SIZE_GIB_PROV="$(jq -r '.volume.size' <<< "$D")"
            ENGINE_ID="$(jq -r '.engine_id // empty' <<< "$D")"
            KIND="${ENGINE_KIND[$ENGINE_ID]:-unknown}"
            ENAME="${ENGINE_NAME[$ENGINE_ID]:-unknown}"

            DB_IP="$(jq -r '([.addresses[]? | select(.access=="PRIVATE" and .type=="IPv4") | .address] | .[0]) // empty' <<< "$D")"

            NODE_OK=false
            APP_OK=false
            NODE_URL=""
            APP_URL=""
            DISK_USED_GIB=""
            DISK_FREE_GIB=""
            DISK_TOTAL_GIB=""
            DISK_USED_PCT=""
            EFFECTIVE_MP="${MOUNTPOINT}"

            if [[ -n "${DB_IP}" ]]; then
              NODE_URL="http://${DB_IP}:8080/node/metrics"
              if curl -sS --max-time "${TIMEOUT}" "${NODE_URL}" >/dev/null 2>&1; then
                NODE_OK=true
                METRICS="$(curl -sS --max-time "${TIMEOUT}" "${NODE_URL}")"

                # Auto-detect mountpoint: prioriza /mnt/database-data, senão maior FS (ignorando tmpfs e mounts de sistema)
                if [[ -z "${MOUNTPOINT}" || "${MOUNTPOINT}" == "/" ]]; then
                  AUTO_MP="$(awk '
                    $0 ~ /^node_filesystem_size_bytes\{/ && $0 !~ /fstype="tmpfs"/ {
                      if (match($0, /mountpoint="[^"]+"/)) {
                        mp = substr($0, RSTART+12, RLENGTH-13)
                        if (mp ~ /^\/run/ || mp=="/boot" || mp=="/boot/efi" || mp=="/proc" || mp=="/sys") next
                        size = $NF + 0
                        if (mp == "/mnt/database-data") preferred = mp
                        if (size > best) { best = size; bestmp = mp }
                      }
                    }
                    END {
                      if (preferred != "") print preferred;
                      else if (bestmp != "") print bestmp;
                    }
                  ' <<< "$METRICS")"
                  EFFECTIVE_MP="${AUTO_MP:-/}"
                fi

                SIZE_B="$(awk -v mp="${EFFECTIVE_MP}" '
                  $0 ~ /^node_filesystem_size_bytes\{/ &&
                  $0 ~ "mountpoint=\""mp"\"" &&
                  $0 !~ /fstype="tmpfs"/ { val=$NF }
                  END { if (val!="") print val }
                ' <<< "$METRICS")"

                AVAIL_B="$(awk -v mp="${EFFECTIVE_MP}" '
                  $0 ~ /^node_filesystem_avail_bytes\{/ &&
                  $0 ~ "mountpoint=\""mp"\"" &&
                  $0 !~ /fstype="tmpfs"/ { val=$NF }
                  END { if (val!="") print val }
                ' <<< "$METRICS")"

                if [[ -n "${SIZE_B}" && -n "${AVAIL_B}" ]]; then
                  read -r DISK_USED_GIB DISK_FREE_GIB DISK_TOTAL_GIB DISK_USED_PCT < <(
                    awk -v size="${SIZE_B}" -v avail="${AVAIL_B}" '
                      BEGIN {
                        s = size + 0
                        a = avail + 0
                        if (s <= 0) exit 0
                        u = s - a
                        gib = 1024*1024*1024
                        printf "%.2f %.2f %.2f %.2f\n", (u/gib), (a/gib), (s/gib), ((u/s)*100)
                      }
                    '
                  )
                fi
              fi

              case "$KIND" in
                mysql)    APP_URL="http://${DB_IP}:8080/mysql/metrics" ;;
                postgres) APP_URL="http://${DB_IP}:8080/postgres/metrics" ;;
                *)        APP_URL="" ;;
              esac

              if [[ -n "${APP_URL}" ]] && curl -sS --max-time "${TIMEOUT}" "${APP_URL}" >/dev/null 2>&1; then
                APP_OK=true
              fi
            fi

            # Log por instância
            echo "== ${NAME} | ${KIND} =="
            echo "id=${INSTANCE_ID} status=${STATUS} prov=${SIZE_GIB_PROV}GiB ip=${DB_IP:-N/A}"
            if [[ "${NODE_OK}" == "true" && -n "${DISK_USED_PCT}" ]]; then
              echo "disk(${EFFECTIVE_MP}) used=${DISK_USED_GIB}GiB free=${DISK_FREE_GIB}GiB total=${DISK_TOTAL_GIB}GiB used%=${DISK_USED_PCT}%"
            else
              echo "disk(${EFFECTIVE_MP}) N/A"
            fi
            echo "node_metrics=${NODE_OK} app_metrics=${APP_OK}"
            echo

            # Decisão: alerta + resize
            SHOULD_ALERT=false
            LEVEL="OK"
            PCT_TO_APPLY=""

            if [[ -n "${DISK_USED_PCT}" ]]; then
              if awk -v v="${DISK_USED_PCT}" -v t="${THRESHOLD_CRIT}" 'BEGIN{ exit !(v+0 >= t+0) }'; then
                SHOULD_ALERT=true
                LEVEL="CRIT"
                PCT_TO_APPLY="${PCT_INCREASE_CRIT}"
              elif awk -v v="${DISK_USED_PCT}" -v t="${THRESHOLD_WARN}" 'BEGIN{ exit !(v+0 >= t+0) }'; then
                SHOULD_ALERT=true
                LEVEL="WARN"
                PCT_TO_APPLY="${PCT_INCREASE_WARN}"
              fi
            fi

            if [[ "${SHOULD_ALERT}" == "true" ]]; then
              msg="🚨 [${LEVEL}] DBaaS '${NAME}' (${KIND}) id=${INSTANCE_ID} region=${REGION} used=${DISK_USED_PCT}% (${DISK_USED_GIB}GiB/${DISK_TOTAL_GIB}GiB) mp=${EFFECTIVE_MP}. Sugestão: +${PCT_TO_APPLY}%."
              gchat_send "${msg}"

              if [[ "${AUTO_APPLY}" == "1" ]]; then
                stamp="${COOLDOWN_DIR}/${INSTANCE_ID}.stamp"
                last=0
                [[ -f "${stamp}" ]] && last="$(cat "${stamp}" 2>/dev/null || echo 0)"
                [[ "${last}" =~ ^[0-9]+$ ]] || last=0
                age=$(( now_epoch - last ))

                if (( last > 0 && age < cooldown_sec )); then
                  echo "INFO: cooldown ativo p/ ${NAME} (id=${INSTANCE_ID}). Pulando auto-apply."
                  gchat_send "⏳ Cooldown: DBaaS '${NAME}' id=${INSTANCE_ID} ainda dentro do cooldown, não disparei resize."
                else
                  echo "INFO: disparando resize job para ${NAME} (id=${INSTANCE_ID}) com +${PCT_TO_APPLY}% ..."
                  resp="$(rundeck_run_resize_job "${INSTANCE_ID}" "${NAME}" "${PCT_TO_APPLY}" || true)"
                  exec_id="$(jq -r '.id // .execution.id // empty' <<< "${resp}" 2>/dev/null || true)"

                  if [[ -n "${exec_id}" ]]; then
                    echo "OK: resize job disparado. execution_id=${exec_id}"
                    gchat_send "✅ Resize disparado: DBaaS '${NAME}' id=${INSTANCE_ID} (+${PCT_TO_APPLY}%). Execução: ${exec_id}"
                    echo "${now_epoch}" > "${stamp}"
                  else
                    echo "WARN: não consegui identificar execution id. Resposta: ${resp}"
                    gchat_send "⚠️ Tentei disparar resize do DBaaS '${NAME}' (id=${INSTANCE_ID}), mas não identifiquei execução. Verifique Rundeck."
                  fi
                fi
              else
                echo "INFO: AUTO_APPLY=0. Apenas alerta enviado (sem disparar resize)."
              fi
            fi

            # Persistência (NDJSON)
            jq -n \
              --arg name "$NAME" \
              --arg id "$INSTANCE_ID" \
              --arg status "$STATUS" \
              --arg engine_id "$ENGINE_ID" \
              --arg engine_kind "$KIND" \
              --arg engine_name "$ENAME" \
              --arg volume_gib "$SIZE_GIB_PROV" \
              --arg ip_private "${DB_IP:-}" \
              --arg mountpoint "$EFFECTIVE_MP" \
              --arg node_url "$NODE_URL" \
              --arg app_url "$APP_URL" \
              --arg node_ok "$NODE_OK" \
              --arg app_ok "$APP_OK" \
              --arg disk_used_gib "$DISK_USED_GIB" \
              --arg disk_free_gib "$DISK_FREE_GIB" \
              --arg disk_total_gib "$DISK_TOTAL_GIB" \
              --arg disk_used_pct "$DISK_USED_PCT" \
              --arg level "$LEVEL" \
              --arg pct_to_apply "${PCT_TO_APPLY:-}" \
              '{
                name:$name,
                id:$id,
                status:$status,
                engine:{id:$engine_id,kind:$engine_kind,name:$engine_name},
                volume:{provisioned_gib:($volume_gib|tonumber)},
                network:{ip_private:$ip_private},
                metrics:{
                  mountpoint:$mountpoint,
                  node:{url:$node_url,ok:($node_ok=="true")},
                  app:{url:$app_url,ok:($app_ok=="true")},
                  disk:{
                    used_gib:($disk_used_gib|if .=="" then null else (.|tonumber) end),
                    free_gib:($disk_free_gib|if .=="" then null else (.|tonumber) end),
                    total_gib:($disk_total_gib|if .=="" then null else (.|tonumber) end),
                    used_pct:($disk_used_pct|if .=="" then null else (.|tonumber) end)
                  }
                },
                decision:{
                  level:$level,
                  suggested_increase_pct:($pct_to_apply|if .=="" then null else (.|tonumber) end),
                  auto_apply:($ENV.AUTO_APPLY=="1")
                }
              }' >> "${OUT_NDJSON}"

          done < <(jq -c '.results[]' <<< "$LIST_JSON")

          # NDJSON -> JSON array
          jq -s '.' "${OUT_NDJSON}" > "${OUT_JSON}"
          rm -f "${OUT_NDJSON}"
          echo "Relatório salvo em: ${OUT_JSON}"

  plugins:
    ExecutionLifecycle: {}