- defaultTab: output
  description: 'Procura um snapshot com nome contendo app- e restaura uma nova instância via CLI da MGC.'
  executionEnabled: true
  id: restaura-targets
  loglevel: INFO
  name: 'Restaura snapshot '
  nodeFilterEditable: false
  options:
  - description: Chave de API da MGC
    name: MGCAPIKEY
    required: true
    secure: true
    storagePath: keys/project/monitoring/MGCAPIKEY
    valueExposed: true
  plugins:
    ExecutionLifecycle: {}
  scheduleEnabled: true
  sequence:
    commands:
    - autoSecureInput: 'false'
      passSecureInput: 'false'
      script: |-
        #!/bin/bash
        # ==============================================================================
        # Script: restaura-snapshot
        # Autor: Wilson Lucena
        # Data: 2026-04-14
        # Descrição: Restaura uma VM a partir de um snapshot app-* usando a CLI da MGC
        # version 001
        # ==============================================================================

        set -e

        export MGC_AUTH_TYPE=api-key
        API_KEY=$RD_OPTION_MGCAPIKEY  # Ou defina manualmente se não estiver rodando no Rundeck
        SSH_KEY="managed-services"
        MACHINE_TYPE_ID="0122fb85-0fd0-47d1-bf25-f24ca6f11493"

        # Gera nome único para a VM restaurada
        SUFFIX=$(date +%s)
        VM_NAME="app-$SUFFIX"

        # Busca snapshot com nome contendo "app-"
        SNAPSHOT_ID=$(mgc virtual-machine snapshots list --api-key="$API_KEY" --output json | \
          sed 's/\x1B\[[0-9;]*[mK]//g' | \
          jq -r '.snapshots[] | select(.name | test("app-")) | .id' | head -n 1)

        if [ -z "$SNAPSHOT_ID" ]; then
          echo "❌ Nenhum snapshot com 'app-' encontrado."
          exit 1
        fi

        echo "📦 Snapshot selecionado: $SNAPSHOT_ID"
        echo "🚀 Restaurando com nome: $VM_NAME"

        mgc virtual-machine snapshots restore \
          --name="$VM_NAME" \
          --id="$SNAPSHOT_ID" \
          --ssh-key-name="$SSH_KEY" \
          --machine-type.id="$MACHINE_TYPE_ID" \
          --api-key="$API_KEY"
    keepgoing: false
    strategy: node-first
  uuid: restaura-targets
