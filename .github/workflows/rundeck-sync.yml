name: Sync Rundeck Jobs (Git manda)

on:
  push:
    branches: ["main"]
    paths:
      - "LBaaS/jobs/**"
      - "Mgc-backup/jobs/**"
      - "PerformanceTest/jobs/**"
      - "monitoring/jobs/**"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Java (rd precisa)
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre unzip

      - name: Install Rundeck CLI (rd)
        run: |
          set -euo pipefail
          RD_VERSION="2.0.9"
          curl -L -o rd.zip "https://github.com/rundeck/rundeck-cli/releases/download/v${RD_VERSION}/rundeck-cli-${RD_VERSION}.zip"
          unzip -q rd.zip -d rdcli
          sudo mv rdcli/rd /usr/local/bin/rd
          sudo chmod +x /usr/local/bin/rd
          rd --version

      - name: Configure rd env
        run: |
          echo "RD_URL=${{ secrets.RUNDECK_URL }}" >> $GITHUB_ENV
          echo "RD_TOKEN=${{ secrets.RUNDECK_TOKEN }}" >> $GITHUB_ENV

      - name: Sync jobs to Rundeck (update)
        run: |
          set -euo pipefail
          for project in LBaaS Mgc-backup PerformanceTest monitoring; do
            echo "==> Project: $project"
            for f in "$project"/jobs/*.yaml; do
              [ -e "$f" ] || continue
              echo "   -> $f"
              rd jobs load -p "$project" -F yaml -f "$f" --duplicate update
            done
          done
