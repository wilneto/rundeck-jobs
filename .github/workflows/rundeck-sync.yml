name: Sync Rundeck Jobs (Git manda)

on:
  push:
    branches: ["main"]
    paths:
      - "**/jobs/**/*.yml"
      - "**/jobs/**/*.yaml"
      - ".github/workflows/rundeck-sync.yml"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Java (rd precisa)
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre unzip

      - name: Install Rundeck CLI (rd)
        run: |
          sudo bash -c 'os=any dist=any bash <(curl -s https://packagecloud.io/install/repositories/pagerduty/rundeck/script.deb.sh)'
          sudo apt-get install rundeck-cli
          rd --version

      - name: Configure rd env
        run: |
          echo "RD_URL=${{ secrets.RUNDECK_URL }}" >> $GITHUB_ENV
          echo "RD_TOKEN=${{ secrets.RUNDECK_TOKEN }}" >> $GITHUB_ENV

      - name: Sync only changed jobs to Rundeck
        run: |
          set -euo pipefail
      
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
      
          echo "Diff range: $BEFORE..$AFTER"
      
          if [ -z "$BEFORE" ] || [[ "$BEFORE" =~ ^0+$ ]]; then
            echo "BEFORE inválido, usando HEAD~1 como fallback"
            BEFORE="$(git rev-parse HEAD~1)"
          fi
      
          # 🔒 Blindagem contra shallow clone
          git cat-file -e "${AFTER}^{commit}" 2>/dev/null || git fetch --no-tags --prune origin "${AFTER}"
          git cat-file -e "${BEFORE}^{commit}" 2>/dev/null || git fetch --no-tags --prune origin "${BEFORE}"
      
          mapfile -t files < <(
            git diff --name-only "$BEFORE" "$AFTER" \
              | grep -E '^(LBaaS|Mgc-backup|PerformanceTest|monitoring)/jobs/.*\.ya?ml$' || true
          )
      
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Nenhum job YAML alterado, nada a fazer."
            exit 0
          fi
      
          echo "Arquivos alterados:"
          printf ' - %s\n' "${files[@]}"
      
          for f in "${files[@]}"; do
            project="$(cut -d/ -f1 <<<"$f")"
            echo "==> Update: project=$project file=$f"
            rd jobs load -p "$project" -F yaml -f "$f" --duplicate update
          done