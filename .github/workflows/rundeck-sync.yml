name: Sync Rundeck Jobs (Git manda)

on:
  push:
    branches: ["main"]
    paths:
      - "**/jobs/**/*.yml"
      - "**/jobs/**/*.yaml"
      - ".github/workflows/rundeck-sync.yml"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Java (rd precisa)
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre unzip

      - name: Install Rundeck CLI (rd)
        run: |
          sudo bash -c 'os=any dist=any bash <(curl -s https://packagecloud.io/install/repositories/pagerduty/rundeck/script.deb.sh)'
          sudo apt-get install -y rundeck-cli
          rd --version

      - name: Configure rd env
        run: |
          echo "RD_URL=${{ secrets.RUNDECK_URL }}" >> $GITHUB_ENV
          echo "RD_TOKEN=${{ secrets.RUNDECK_TOKEN }}" >> $GITHUB_ENV

      - name: Sync only changed jobs to Rundeck (CLI only, skip missing projects)
        shell: bash
        run: |
          set -euo pipefail

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          echo "Diff range: ${BEFORE}..${AFTER}"

          if [ -z "${BEFORE}" ] || [[ "${BEFORE}" =~ ^0+$ ]]; then
            echo "BEFORE inválido, usando HEAD~1 como fallback"
            BEFORE="$(git rev-parse HEAD~1)"
          fi

          # 🔒 Blindagem contra shallow clone
          git cat-file -e "${AFTER}^{commit}" 2>/dev/null || git fetch --no-tags --prune origin "${AFTER}"
          git cat-file -e "${BEFORE}^{commit}" 2>/dev/null || git fetch --no-tags --prune origin "${BEFORE}"

          mapfile -t files < <(
            git diff --name-only "${BEFORE}" "${AFTER}" \
              | grep -E '^[^/]+/jobs/.*\.ya?ml$' || true
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "Nenhum job YAML alterado, nada a fazer."
            exit 0
          fi

          echo "Arquivos alterados:"
          printf ' - %s\n' "${files[@]}"

          # Cache da lista de projetos existentes
          mapfile -t existing_projects < <(rd projects list | awk '{print $1}')
          projects_text="$(printf "%s\n" "${existing_projects[@]}")"

          missing_projects=()
          synced=0
          skipped=0

          for f in "${files[@]}"; do
            project="$(cut -d/ -f1 <<<"${f}")"
            echo "==> Update: project=${project} file=${f}"

            if ! grep -qx "${project}" <<<"${projects_text}"; then
              echo "⚠️  Projeto '${project}' não existe no Rundeck. Pulando arquivo: ${f}"
              missing_projects+=("${project}")
              skipped=$((skipped + 1))
              continue
            fi

            rd jobs load -p "${project}" -F yaml -f "${f}" --duplicate update
            synced=$((synced + 1))
          done

          echo
          echo "===== Resumo ====="
          echo "Synced:  ${synced}"
          echo "Skipped: ${skipped}"

          if [ "${#missing_projects[@]}" -gt 0 ]; then
            echo
            echo "Projetos ausentes (crie no Rundeck e faça push novamente):"
            printf ' - %s\n' "${missing_projects[@]}" | sort -u
          fi