          #  | jq -r '.assets[] | select(.name | test("linux.*amd64|linux.*x86_64|linux.*64|rd.*linux"; "i")) | .browser_download_url' \
          #  | head -n1)"
          # sudo curl -s https://packagecloud.io/install/repositories/pagerduty/rundeck/script.rpm.sh?any=true | sudo bash

          # sudo sed -i.bak s/gpgcheck=0/gpgcheck=1/ /etc/yum.repos.d/rundeck.repo
          # sudo rpm --import https://raw.githubusercontent.com/rundeck/packaging/main/pubring.gpg
          # sudo apt-get update




#
          #if [ -z "${url}" ] || [ "${url}" = "null" ]; then
          #  echo "Não achei asset do rd no release v${RD_VERSION}."
          #  echo "Listando assets disponíveis:"
          #  curl -sL "https://api.github.com/repos/rundeck/rundeck-cli/releases/tags/v${RD_VERSION}" \
          #    | jq -r '.assets[].name'
          #  exit 1
          #fi
#
          #echo "Baixando: ${url}"
          #curl -fL -o rd "${url}"
          #sudo install -m 0755 rd /usr/local/bin/rd

          rd --version

      - name: Configure rd env
        run: |
          echo "RD_URL=${{ secrets.RUNDECK_URL }}" >> $GITHUB_ENV
          echo "RD_TOKEN=${{ secrets.RUNDECK_TOKEN }}" >> $GITHUB_ENV

      - name: Sync jobs to Rundeck (update)
        run: |
          set -euo pipefail
          for project in LBaaS Mgc-backup PerformanceTest monitoring; do
            echo "==> Project: $project"
            for f in "$project"/jobs/*.yaml; do
              [ -e "$f" ] || continue
              echo "   -> $f"
              rd jobs load -p "$project" -F yaml -f "$f" --duplicate update
            done
          done