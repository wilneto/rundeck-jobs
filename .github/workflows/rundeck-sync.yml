name: Sync Rundeck Jobs (Git manda)

on:
  push:
    branches: ["main"]
    paths:
      - "LBaaS/jobs/**"
      - "Mgc-backup/jobs/**"
      - "PerformanceTest/jobs/**"
      - "monitoring/jobs/**"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Java (rd precisa)
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre unzip

    - name: Install Rundeck CLI (rd)
        env:
          RD_VERSION: "2.0.9"
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq curl
          apt-get install rundeck-cli -y 

          ## Descobre a URL do asset linux-amd64 do release
