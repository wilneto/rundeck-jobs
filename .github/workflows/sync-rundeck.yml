name: Sync Rundeck Jobs

on:
  push:
    branches:
      - main
    paths:
      - "*/jobs/*.yml"
      - "*/jobs/*.yaml"
  workflow_dispatch:

jobs:
  sync:
    name: Sync changed jobs to Rundeck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed job files
        id: changed
        run: |
          BASE_SHA="${{ github.event.before }}"

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA=$(git rev-parse HEAD~1)
          fi

          CHANGED=$(git diff --name-only "$BASE_SHA" HEAD -- '*/jobs/*.yml' '*/jobs/*.yaml' | tr '\n' ' ')
          echo "files=${CHANGED}" >> "$GITHUB_OUTPUT"
          echo "Changed files: ${CHANGED:-none}"

      - name: Sync jobs to Rundeck
        if: steps.changed.outputs.files != ''
        env:
          RUNDECK_URL: ${{ secrets.RUNDECK_URL }}
          RUNDECK_TOKEN: ${{ secrets.RUNDECK_TOKEN }}
        run: |
          SUCCESS=0
          SKIPPED=0
          FAILED=0

          for file in ${{ steps.changed.outputs.files }}; do
            PROJECT=$(echo "$file" | cut -d'/' -f1)
            echo "Processing: $file → project: $PROJECT"

            # Check if project exists
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "X-Rundeck-Auth-Token: $RUNDECK_TOKEN" \
              "$RUNDECK_URL/api/41/project/$PROJECT")

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Importing job: $file"
              RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
                -H "X-Rundeck-Auth-Token: $RUNDECK_TOKEN" \
                -H "Content-Type: application/yaml" \
                --data-binary "@$file" \
                "$RUNDECK_URL/api/41/project/$PROJECT/jobs/import?format=yaml&dupeOption=update")

              HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
              BODY=$(echo "$RESPONSE" | head -n -1)

              if [ "$HTTP_CODE" = "200" ]; then
                echo "Done: $file"
                SUCCESS=$((SUCCESS + 1))
              else
                echo "ERROR importing $file (HTTP $HTTP_CODE): $BODY"
                FAILED=$((FAILED + 1))
              fi
            else
              echo "WARNING: Project '$PROJECT' not found in Rundeck (HTTP $HTTP_STATUS). Skipping."
              echo "Create the project and push again."
              SKIPPED=$((SKIPPED + 1))
            fi
          done

          echo ""
          echo "=== Summary ==="
          echo "Success : $SUCCESS"
          echo "Skipped : $SKIPPED"
          echo "Failed  : $FAILED"

          [ "$FAILED" -gt 0 ] && exit 1 || exit 0

      - name: No jobs changed
        if: steps.changed.outputs.files == ''
        run: echo "No job files changed. Nothing to sync."
