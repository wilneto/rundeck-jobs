name: Sync Rundeck Jobs

on:
  push:
    branches:
      - main
    paths:
      - "*/jobs/*.yml"
      - "*/jobs/*.yaml"
  workflow_dispatch:

jobs:
  sync:
    name: Sync changed jobs to Rundeck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rundeck CLI (rd)
        run: |
          RD_VERSION=$(curl -s "https://repo1.maven.org/maven2/org/rundeck/rundeck-cli/maven-metadata.xml" \
            | grep '<release>' | sed 's/.*<release>\(.*\)<\/release>.*/\1/')
          echo "Installing rd version: ${RD_VERSION}"
          curl -fsSL "https://repo1.maven.org/maven2/org/rundeck/rundeck-cli/${RD_VERSION}/rundeck-cli-${RD_VERSION}-all.jar" \
            -o /tmp/rd.jar
          sudo mv /tmp/rd.jar /usr/local/lib/rd.jar
          printf '#!/bin/sh\nexec java -jar /usr/local/lib/rd.jar "$@"\n' | sudo tee /usr/local/bin/rd > /dev/null
          sudo chmod +x /usr/local/bin/rd
          rd version

      - name: Detect changed job files
        id: changed
        run: |
          BASE_SHA="${{ github.event.before }}"

          # workflow_dispatch: compare HEAD~1 as fallback
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA=$(git rev-parse HEAD~1)
          fi

          CHANGED=$(git diff --name-only "$BASE_SHA" HEAD -- '*/jobs/*.yml' '*/jobs/*.yaml' | tr '\n' ' ')
          echo "files=${CHANGED}" >> "$GITHUB_OUTPUT"
          echo "Changed files: ${CHANGED:-none}"

      - name: Sync jobs to Rundeck
        if: steps.changed.outputs.files != ''
        env:
          RD_URL: ${{ secrets.RUNDECK_URL }}
          RD_TOKEN: ${{ secrets.RUNDECK_TOKEN }}
        run: |
          for file in ${{ steps.changed.outputs.files }}; do
            PROJECT=$(echo "$file" | cut -d'/' -f1)
            echo "Processing: $file → project: $PROJECT"

            if rd projects info --project "$PROJECT" > /dev/null 2>&1; then
              echo "Importing job: $file"
              rd jobs load --project "$PROJECT" --file "$file" --format yaml --duplicate update
              echo "Done: $file"
            else
              echo "WARNING: Project '$PROJECT' does not exist in Rundeck. Skipping."
              echo "Create the project and push again."
            fi
          done

      - name: No jobs changed
        if: steps.changed.outputs.files == ''
        run: echo "No job files changed. Nothing to sync."
