name: Sync Rundeck Jobs

on:
  push:
    branches:
      - main
    paths:
      - "*/jobs/*.yml"
      - "*/jobs/*.yaml"
  workflow_dispatch:

jobs:
  sync:
    name: Sync changed jobs to Rundeck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Java and Rundeck CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip default-jre
          sudo bash -c 'os=any dist=any bash <(curl -s https://packagecloud.io/install/repositories/pagerduty/rundeck/script.deb.sh)'
          sudo apt-get install -y rundeck-cli
          rd version

      - name: Set Rundeck credentials
        run: |
          echo "RD_URL=${{ secrets.RUNDECK_URL }}" >> $GITHUB_ENV
          echo "RD_TOKEN=${{ secrets.RUNDECK_TOKEN }}" >> $GITHUB_ENV

      - name: Detect changed job files and sync
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.before }}"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA=$(git rev-parse HEAD~1)
          fi

          echo "Diff range: ${BASE_SHA}..${{ github.sha }}"
          git fetch origin "$BASE_SHA" 2>/dev/null || true

          CHANGED=$(git diff --name-only "$BASE_SHA" "${{ github.sha }}" -- '*/jobs/*.yml' '*/jobs/*.yaml')

          if [ -z "$CHANGED" ]; then
            echo "Nenhum arquivo de job alterado."
            exit 0
          fi

          echo "Arquivos alterados:"
          echo "$CHANGED" | sed 's/^/ - /'

          SYNCED=0
          SKIPPED=0

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            PROJECT=$(echo "$file" | cut -d'/' -f1)
            echo ""
            echo "==> Update: project=$PROJECT file=$file"

            if rd projects info --project "$PROJECT" > /dev/null 2>&1; then
              rd jobs load \
                --project "$PROJECT" \
                --file "$file" \
                --format yaml \
                --duplicate update
              SYNCED=$((SYNCED + 1))
            else
              echo "WARN: Projeto '$PROJECT' não existe no Rundeck. Pulando."
              echo "Crie o projeto e faça push novamente."
              SKIPPED=$((SKIPPED + 1))
            fi
          done <<< "$CHANGED"

          echo ""
          echo "===== Resumo ====="
          echo "Synced:  $SYNCED"
          echo "Skipped: $SKIPPED"
